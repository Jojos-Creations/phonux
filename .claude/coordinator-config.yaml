# .claude/coordinator-config.yaml -- phonux (the library)
#
# Coordinator config for this repo's plan pipeline (GitHub issues and pull
# requests; see plans/README.md). Anything omitted here falls back to the
# coordinator's own defaults, EXCEPT strict_gate: a missing gate makes the
# coordinator ask rather than guess.

default_branch: main
branch_prefix: plan
worktree_root: ../phonux-lib.worktrees

escalation_model: opus
max_parallel_workers: 8

# CI runs the same lines on pull requests into release and on dispatch. A pull
# request into main requires no status check, so the authoring session runs all
# of them locally before it merges.
strict_gate:
  - npm run typecheck
  - npm run lint
  - npm test
  - npm run build
  - npm run check:api-report
  - npm run smoke
  - python3 tools/vendor-queue-tooling.py . --check
  - python3 tools/queue/queue.py lint --offline

# Names the release ruleset requires; each must be a check run CI reports, else
# no promotion can pass. Read as a block list by tools/queue/queue.py.
release_required_checks:
  - check

# Stays empty unless a failure is independently tracked as pre-existing;
# never use this to silence a regression an entry itself introduced.
tolerated_test_failures: []

autodetect_shared_resources: true
shared_resources: []
exclusive_resources: []
cascade_rules: []
verifier_mode: local

# Who may judge a pull request. The merge judge (tools/queue/report_rules.py,
# `queue ship --check`, `queue gate-pass`) counts only reviews whose author
# login is listed here; on a public repo anyone can post a review, so any
# other login's PASS is ignored and can never replace a real FAIL. No list,
# or an empty one, refuses every merge. gate-pass reads origin/main's copy,
# so a pull request cannot add its own author. The login is the whole lock:
# GitHub reports an org owner's own reviews as CONTRIBUTOR, so the review's
# author_association is deliberately not checked.
# `queue list`, `status` and `doctor` also read only the issues and pull
# requests these logins opened, and refuse to run without the list.
verifier_logins:
  - ChicoBitcoinJoe
ship_behind_policy: disjoint-ok
gh_mode: on
pipeline: github
