name: Dist branch

# Only a promotion to release builds dist: Actions minutes are spent on release candidates and versions.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dist-branch
  cancel-in-progress: false

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Build and pack smoke only, not the full suite: a broken package must never replace the last good dist, and release is verified before it lands.
      - run: npm run smoke
      - name: Force-push dist/ to the dist branch
        run: |
          cd dist
          git init -q
          git config user.name "phonux dist bot"
          git config user.email "dist-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Built package from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/dist
      # The dist branch is force-pushed as a new root commit, so the previous build sits on no ref. A tag per build keeps every pinned SHA fetchable.
      - name: Tag the dist commit by its source sha
        run: |
          cd dist
          tag="dist-${GITHUB_SHA}"
          remote="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -n "$(git ls-remote --tags "$remote" "refs/tags/${tag}")" ]; then
            echo "${tag} already exists; keeping it"
            exit 0
          fi
          git tag "${tag}"
          git push "$remote" "refs/tags/${tag}"
