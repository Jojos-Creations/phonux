name: Secret scan

# Runs on every pull request and every push to main. Verified-only trufflehog
# fails on live credentials; gitleaks catches key-shaped strings trufflehog skips.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog (verified secrets only)
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --results=verified,unknown

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gl.tgz
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks detect --source . --redact --verbose --exit-code 1
