name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The two ignored shellcheck notes are an unread retry counter and an ls-in-a-pipeline note in existing workflows; every other finding blocks.
      - name: actionlint
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/bin/actionlint" -color -ignore "SC2034:warning:.*attempt appears unused" -ignore "SC2012:info"
      # Offline: the online audits need a token this job does not hold. Any finding at high severity fails the job.
      - name: zizmor
        run: pipx run zizmor==1.33.1 --offline --no-progress --min-severity high .github/workflows
