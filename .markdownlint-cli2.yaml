# .markdownlint-cli2.yaml -- lints every markdown file this template
# authors. .github/workflows/agent-config-checks.yml and
# .githooks/lib/markdown_lint.sh (sourced from .githooks/pre-commit) both
# read THIS file -- there is no second copy of the rule set to keep in step
# with.
globs:
  - "**/*.md"

ignores:
  # A performance/correctness floor, not a scope decision -- this template
  # ships no node_modules today, but a fork that runs `npm install` here
  # must not have it walked.
  - "node_modules/**"
  # plans/records/** is the staged-queue tooling's own archive shape (see
  # templates/plans/SCHEMA.md's "Record" section): once a repo adopts the
  # queue (tools/vendor-queue-tooling.py) and a legacy migration runs
  # (tools/queue/migrate-queue.py), this directory fills with narrative
  # copied VERBATIM out of migrated queue entries -- the migration tool
  # asserts the bytes moved across unchanged (its byte-accounting check).
  # Running the standard markdown auto-fixer over it would rewrite exactly
  # the passages that assertion covers -- the record would stop being the
  # record. This ignore is LIVE, not inert: since phase 3b (2026-09-08) this
  # template's own root carries a real plans/ directory and dogfoods its own
  # queue (see docs/adr/0005's "Dogfooding this template's own tree"
  # section) -- a migrated record lands under plans/records/ in this very
  # repo, not only in a future fork. It also travels with this file to
  # every repo that vendors it alongside the queue tooling, so the
  # exemption need not be rediscovered there either.
  - "plans/records/**"
  #
  # NOT in Repo B's own ignore list this one is adapted from, and why:
  #   submodules/**            -- this template has no submodules/ directory
  #                                at all; nothing to exclude.
  #   .github/agents/**        -- ditto, does not exist here.
  #   .github/instructions/**  -- this template DOES have this directory,
  #                                but unlike Repo B's copy (vendored,
  #                                unauthored Copilot persona files this
  #                                repo does not maintain), this template's
  #                                copies are GENERATED BY THIS REPO'S OWN
  #                                tools/sync-agent-rules.py from its own
  #                                .claude/rules/*.md -- content this repo
  #                                does author, one hop removed. They
  #                                already lint clean (verified: 0 issues
  #                                across all 8 files under this glob before
  #                                this config existed), so there is nothing
  #                                to exempt; excluding a directory that
  #                                passes on its own merits would just be a
  #                                blind spot waiting to happen the day one
  #                                of them stops passing.

config:
  # MD060 table-column-style: pin the style instead of letting it be
  # inferred. The default is "consistent", which infers per FILE from that
  # file's own first table -- so a file whose tables are internally mixed
  # goes red while the corpus as a whole is uniform, and the message names a
  # style nobody chose (this is exactly what Repo B hit: 44 errors, all
  # MD060, citing two different styles across 2 files).
  #
  # WHICH STYLE, decided by running this gate (with every other rule below
  # already applied) against this tree. Issue counts are markdownlint-cli2's
  # own Summary line. REPRODUCE by editing this one key in a scratch COPY of
  # the tree and re-running `npx --offline markdownlint-cli2` -- and note
  # what a run measures: the corpus AS IT STANDS AT THAT MOMENT.
  #
  # Measured 2026-09-07, BEFORE that same commit's own `--fix` pass, over 56
  # files:
  #
  #     style: compact     79 issues in 9 files   <- chosen
  #     style: aligned    249 issues in 9 files
  #     style: tight      543 issues in 9 files
  #
  # Re-measured 2026-09-08 (repair round 2), AFTER that --fix pass and after
  # dogfooding added files, over 59 files. Same decision, different corpus,
  # which is why the numbers differ -- an undated figure here reads as
  # irreproducible:
  #
  #     style: compact      0 issues in 0 files   <- chosen, and now clean
  #     style: aligned    256 issues in 9 files
  #     style: tight      628 issues in 9 files
  #
  # "compact" is markdownlint's name for the single-space form
  # `| --- | --- |`; "tight" is `|---|---|` (see its own doc/md060.md). This
  # pins what the corpus already overwhelmingly is (76 of the 79 compact
  # issues are MD060 in tables that are internally already single-space but
  # inconsistent file to file); the 3 non-MD060 outliers (unlabeled fenced
  # code blocks, MD040) were fixed by hand, and the rest by
  # `npx markdownlint-cli2 --fix`.
  MD060:
    style: compact

  # MD013: line length -- noisy with long table cells and URLs
  MD013: false
  # MD022/MD032: blanks around headings and lists -- tight formatting used
  # throughout this repo's rule and skill files
  MD022: false
  MD032: false
  # MD024: duplicate heading names -- a valid pattern across skill/rule
  # files with parallel section structure
  MD024: false
  # MD025: single top-level heading -- some docs use multiple h1 sections
  MD025: false
  # MD029: ordered list prefix style -- preference, not correctness
  MD029: false
  # MD033: inline HTML -- used intentionally (the GENERATED fence markers
  # themselves are HTML comments)
  MD033: false
  # MD041: first line should be top-level heading -- files that start with
  # frontmatter (SKILL.md's `---\nname: ...`) or a generated-file banner
  # are not violations
  MD041: false
